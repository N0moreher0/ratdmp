name: release-binaries

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp "cli/target/${{ matrix.target }}/release/ratdmp" package/ratdmp
          cp LICENSE README.md package/

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "cli/target/${{ matrix.target }}/release/ratdmp.exe" package/ratdmp.exe
          Copy-Item LICENSE, README.md package/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ratdmp-cli-${{ matrix.target }}
          path: package
          if-no-files-found: error

  release:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ratdmp-cli-*
          path: packages
          merge-multiple: false

      - name: Create archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -n 1)"
          mkdir -p dist
          tar -C packages/ratdmp-cli-x86_64-unknown-linux-gnu -czf "dist/ratdmp-cli-${version}-x86_64-unknown-linux-gnu.tar.gz" .
          tar -C packages/ratdmp-cli-x86_64-apple-darwin -czf "dist/ratdmp-cli-${version}-x86_64-apple-darwin.tar.gz" .
          (
            cd packages/ratdmp-cli-x86_64-pc-windows-msvc
            zip -q -r "../../dist/ratdmp-cli-${version}-x86_64-pc-windows-msvc.zip" .
          )
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_SHA::12}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Automated build ${GITHUB_SHA::12}" \
            --notes "Prebuilt ratdmp-cli binaries for commit ${GITHUB_SHA}."
